<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quét dữ liệu QR</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a73e8">
<link rel="icon" href="icon-192.png">
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 16px; background: #f4f6f8; color: #202124; }
  h1 { font-size: 20px; text-align: center; margin: 4px 0 16px; }
  .btn { display: block; width: 100%; padding: 20px; font-size: 22px; border: 0;
    border-radius: 12px; margin-bottom: 12px; text-align: center; box-sizing: border-box;
    background: #1a73e8; color: #fff; font-weight: bold; cursor: pointer; }
  .btn.stop { background: #d93025; }
  .btn.photo { background: #f9ab00; color: #202124; }
  .btn.gray { background: #e8eaed; color: #202124; font-size: 18px; padding: 14px; font-weight: normal; }
  .btn:disabled { background: #9aa0a6; }
  input[type=text], input[type=email] { width: 100%; box-sizing: border-box; padding: 16px; font-size: 20px;
    border: 1px solid #c4c7c5; border-radius: 10px; margin-bottom: 12px; }
  #otp { letter-spacing: 8px; text-align: center; font-size: 26px; }
  #reader { width: 100%; margin-bottom: 12px; border-radius: 12px; overflow: hidden; }
  #tools { display: none; align-items: center; gap: 10px; margin-bottom: 12px; }
  #tools input[type=range] { flex: 1; }
  #btnTorch { display: none; padding: 8px 14px; font-size: 15px; border: 0; border-radius: 8px; background: #e8eaed; }
  #bar { display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    color: #5f6368; margin-bottom: 12px; }
  #bar button { border: 0; background: #e8eaed; border-radius: 8px; padding: 6px 12px; font-size: 14px; }
  #status, #loginMsg { text-align: center; font-size: 17px; font-weight: bold; min-height: 24px; margin: 8px 0 4px; }
  #counter { text-align: center; font-size: 15px; margin: 4px 0 12px; font-weight: bold; }
  .ok { color: #188038; } .err { color: #d93025; } .wait { color: #1a73e8; } .dupc { color: #b06000; }
  #list { margin: 0; padding: 0; list-style: none; }
  #list li { background: #fff; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
    font-size: 15px; word-break: break-word; border-left: 5px solid #9aa0a6; }
  #list li.ok { border-left-color: #188038; }
  #list li.err { border-left-color: #d93025; }
  #list li.wait { border-left-color: #1a73e8; }
  #list li.dup { border-left-color: #f9ab00; }
  #list small { display: block; color: #5f6368; margin-top: 2px; }
  #list li.err small { color: #d93025; }
  .mini { margin-top: 6px; margin-right: 6px; padding: 6px 12px; font-size: 14px; border: 0;
    border-radius: 6px; background: #e8eaed; }
</style>
</head>
<body>

<!-- Màn hình đăng nhập -->
<div id="loginView" style="display:none">
  <h1>Đăng nhập</h1>
  <input type="email" id="email" placeholder="Email được cấp quyền" autocomplete="email">
  <button class="btn" id="btnSendOtp">Gửi mã OTP</button>
  <div id="otpBox" style="display:none">
    <input type="text" id="otp" inputmode="numeric" maxlength="6" placeholder="Mã 6 số" autocomplete="one-time-code">
    <button class="btn" id="btnVerify">Xác nhận</button>
  </div>
  <div id="loginMsg"></div>
</div>

<!-- Màn hình quét -->
<div id="appView" style="display:none">
  <h1>Quét dữ liệu QR</h1>
  <div id="bar"><span id="who"></span><button id="btnLogout">Đăng xuất</button></div>
  <button class="btn" id="btnScan">Quét dữ liệu</button>
  <div id="reader"></div>
  <div id="tools">
    <span>Zoom</span><input type="range" id="zoom"><button id="btnTorch">Đèn</button>
  </div>

  <!-- Chế độ chụp ảnh (tự hiện khi quét trực tiếp không đọc được) -->
  <div id="photoBox" style="display:none">
    <label class="btn photo">Chụp ảnh mã QR
      <input type="file" accept="image/*" capture="environment" id="file" hidden>
    </label>
    <button class="btn gray" id="btnBackLive">Quay lại quét trực tiếp</button>
  </div>

  <div id="status"></div>
  <div id="counter"></div>
  <ul id="list"></ul>
</div>
<div id="readerFile" style="display:none"></div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbzH54NyMQMzz1W6usIU2F9QYvQ63avd6B6qapqFerMLafDm9F8Mvzk5ZobfurFjyoiJJA/exec';
  const FIELD_COUNT = 7;
  const DATE_FIELDS = [4, 7];
  const COOLDOWN_MS = 5000;       // bỏ qua cùng một mã quét lại trong 5 giây
  const PAUSE_MS = 1200;          // tạm dừng camera sau mỗi lần đọc thành công
  const AUTO_PHOTO_MS = 5000;     // quá thời gian này không đọc được mã thì chuyển sang chụp ảnh
  const MAX_PARALLEL = 2;         // số mã gửi đồng thời
  const TIMEOUT_MS = 40000;       // quá thời gian này coi như lỗi

  const $ = id => document.getElementById(id);
  let token = '', userEmail = '';
  let scanner = null, scanning = false, scanTimer = null, photoBusy = false;
  let queue = [], nextId = 1, active = 0, savedCount = 0, dupCount = 0;
  let lastText = '', lastTime = 0;
  let sessionKeys = new Set();
  let audioCtx = null, torchOn = false;

  // ---------- Lưu trữ cục bộ ----------
  function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsSet(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function api(body, timeout) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeout || TIMEOUT_MS);
    try {
      const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body), signal: ctrl.signal });
      return await res.json();
    } finally { clearTimeout(timer); }
  }

  // ---------- Đăng nhập ----------
  function loginMsg(t, cls) { $('loginMsg').textContent = t; $('loginMsg').className = cls || ''; }

  function showLogin(msg, cls) {
    $('appView').style.display = 'none';
    $('photoBox').style.display = 'none';
    $('loginView').style.display = 'block';
    $('otpBox').style.display = 'none';
    $('otp').value = '';
    if (userEmail) $('email').value = userEmail;
    loginMsg(msg || '', cls);
  }

  function showApp() {
    $('loginView').style.display = 'none';
    $('appView').style.display = 'block';
    $('who').textContent = userEmail;
    render();
  }

  async function sendOtp() {
    const em = $('email').value.trim().toLowerCase();
    if (!em) { loginMsg('Hãy nhập email.', 'err'); return; }
    $('btnSendOtp').disabled = true;
    loginMsg('Đang gửi mã...', 'wait');
    try {
      const r = await api({ action: 'requestOtp', email: em }, 30000);
      if (r.ok) {
        userEmail = em;
        $('otpBox').style.display = 'block';
        loginMsg('Đã gửi mã 6 số tới ' + em + '. Hãy kiểm tra hộp thư (cả thư rác).', 'ok');
        $('otp').focus();
      } else loginMsg(r.error || 'Không gửi được mã.', 'err');
    } catch (e) { loginMsg('Lỗi kết nối, hãy thử lại.', 'err'); }
    $('btnSendOtp').disabled = false;
  }

  async function verifyOtp() {
    const code = $('otp').value.trim();
    if (code.length < 6) { loginMsg('Hãy nhập đủ 6 số.', 'err'); return; }
    $('btnVerify').disabled = true;
    loginMsg('Đang xác nhận...', 'wait');
    try {
      const r = await api({ action: 'verifyOtp', email: userEmail, otp: code }, 30000);
      if (r.ok) {
        token = r.token; userEmail = r.email;
        lsSet('qr_token', token); lsSet('qr_email', userEmail);
        showApp();
        pump();
      } else loginMsg(r.error || 'Mã OTP không đúng.', 'err');
    } catch (e) { loginMsg('Lỗi kết nối, hãy thử lại.', 'err'); }
    $('btnVerify').disabled = false;
  }

  async function logout() {
    await stopScan();
    token = ''; lsSet('qr_token', '');
    showLogin('Đã đăng xuất.', 'ok');
  }

  async function authLost() {
    await stopScan();
    token = ''; lsSet('qr_token', '');
    queue.forEach(it => {
      if (it.state === 'wait') { it.state = 'err'; it.msg = 'Chưa gửi do hết phiên đăng nhập. Hãy đăng nhập lại rồi bấm Thử lại.'; }
    });
    showLogin('Phiên đăng nhập đã hết hạn. Hãy đăng nhập lại.', 'err');
  }

  // ---------- Kiểm tra dữ liệu mã QR ----------
  function parse(text) {
    const seps = ['\n', '\t', '|', ';', ','];
    for (const s of seps) {
      const p = text.split(s).map(x => x.trim());
      if (p.length >= FIELD_COUNT) return p.slice(0, FIELD_COUNT);
    }
    return null;
  }

  function validDate(s) {
    s = String(s).trim();
    const m = s.match(/^(\d{2})(\d{2})(\d{4})$/) || s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
    if (!m) return false;
    const d = +m[1], mo = +m[2], y = +m[3];
    const dt = new Date(y, mo - 1, d);
    return dt.getFullYear() === y && dt.getMonth() === mo - 1 && dt.getDate() === d;
  }

  function keyOf(f) { return f.map(x => x.toUpperCase()).join('\u0001'); }

  function beep() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 1000; g.gain.value = 0.15;
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.12);
    } catch (e) {}
    if (navigator.vibrate) navigator.vibrate(120);
  }

  function status(text, cls) { $('status').textContent = text; $('status').className = cls || ''; }

  // ---------- Danh sách và trạng thái ----------
  function render() {
    const pending = queue.filter(x => x.state === 'wait' || x.state === 'send').length;
    const items = queue.slice(-10).reverse();
    $('list').innerHTML = items.map(it => {
      const cls = it.state === 'send' ? 'wait' : it.state;
      const label = it.state === 'ok' ? '✔ Đã lưu (dòng ' + it.row + ')'
                  : it.state === 'dup' ? '⚠ Đã có trong Google Sheet (dòng ' + it.row + '), không ghi lại'
                  : (it.state === 'wait' || it.state === 'send') ? '⏳ Đang lưu...'
                  : '✘ ' + esc(it.msg);
      let btns = '';
      if (it.state === 'err') {
        btns = '<br><button class="mini" data-act="retry" data-id="' + it.id + '">Thử lại</button>' +
               '<button class="mini" data-act="drop" data-id="' + it.id + '">Bỏ</button>';
      }
      return '<li class="' + cls + '"><b>' + esc(it.f[0]) + '</b> | ' + esc(it.f[1]) +
             ' | ' + esc(it.f[3]) + '<small>' + label + '</small>' + btns + '</li>';
    }).join('');
    $('counter').textContent = 'Đang lưu: ' + pending + '  |  Đã lưu: ' + savedCount + '  |  Trùng bỏ qua: ' + dupCount;
  }

  // ---------- Gửi dữ liệu ----------
  function pump() {
    if (!token) return;
    while (active < MAX_PARALLEL) {
      const it = queue.find(x => x.state === 'wait');
      if (!it) return;
      send(it);
    }
  }

  async function send(it) {
    it.state = 'send'; active++; render();
    try {
      const r = await api({ action: 'save', token: token, fields: it.f });
      if (r.ok && r.duplicate) { it.state = 'dup'; it.row = r.row; dupCount++; }
      else if (r.ok) { it.state = 'ok'; it.row = r.row; savedCount++; }
      else if (r.auth === false) { it.state = 'err'; it.msg = 'Hết phiên đăng nhập. Hãy đăng nhập lại rồi bấm Thử lại.'; authLost(); }
      else { it.state = 'err'; it.msg = 'Lưu thất bại: ' + r.error; }
    } catch (e) {
      it.state = 'err';
      it.msg = e.name === 'AbortError'
        ? 'Quá thời gian chờ. Bấm Thử lại (hệ thống tự bỏ qua nếu dữ liệu đã được ghi).'
        : 'Lỗi kết nối (' + e.message + '). Hãy bấm Thử lại.';
    } finally {
      active--; render(); pump();
    }
  }

  $('list').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    const id = Number(b.dataset.id);
    const it = queue.find(x => x.id === id);
    if (!it) return;
    if (b.dataset.act === 'retry') { it.state = 'wait'; render(); pump(); }
    else if (b.dataset.act === 'drop') { sessionKeys.delete(keyOf(it.f)); queue = queue.filter(x => x.id !== id); render(); }
  });

  window.addEventListener('beforeunload', e => {
    if (queue.some(x => x.state === 'wait' || x.state === 'send')) { e.preventDefault(); e.returnValue = ''; }
  });

  // ---------- Xử lý nội dung mã QR (dùng chung cho quét trực tiếp và chụp ảnh) ----------
  // Trả về true nếu mã hợp lệ và đã đưa vào hàng đợi lưu
  function handleText(text) {
    const f = parse(text);
    if (!f) { status('✘ Mã QR không đủ ' + FIELD_COUNT + ' trường: ' + text, 'err'); return false; }
    for (const no of DATE_FIELDS) {
      if (!validDate(f[no - 1])) {
        status('✘ Trường ' + no + ' không phải ngày hợp lệ: ' + f[no - 1] + '. Hãy quét lại.', 'err');
        return false;
      }
    }
    const k = keyOf(f);
    if (sessionKeys.has(k)) { status('⚠ Mã này đã quét trong phiên làm việc, không gửi lại.', 'dupc'); return false; }
    sessionKeys.add(k);

    beep();
    status('✔ Đã đọc mã, đưa mã tiếp theo vào khung', 'ok');
    queue.push({ id: nextId++, f: f, state: 'wait' });
    render();
    pump();
    return true;
  }

  // ---------- Quét trực tiếp bằng camera ----------
  function armTimer() {
    clearTimeout(scanTimer);
    if (scanning) scanTimer = setTimeout(switchToPhoto, AUTO_PHOTO_MS);
  }
  function clearTimer() { clearTimeout(scanTimer); scanTimer = null; }

  function pauseThenResume() {
    try { scanner.pause(true); } catch (e) { return; }
    setTimeout(() => {
      if (scanning) { try { scanner.resume(); } catch (e) {} armTimer(); }
    }, PAUSE_MS);
  }

  function onScan(text) {
    clearTimer();
    const now = Date.now();
    if (text === lastText && now - lastTime < COOLDOWN_MS) { lastTime = now; armTimer(); return; }
    lastText = text; lastTime = now;
    if (handleText(text)) pauseThenResume();
    else armTimer();
  }

  // Quá 5 giây không đọc được: tắt camera trực tiếp và chuyển sang chụp ảnh
  async function switchToPhoto() {
    if (!scanning) return;
    await stopScan();
    $('photoBox').style.display = 'block';
    status('Không đọc được mã trực tiếp. Hãy chạm nút vàng để chụp ảnh mã QR.', 'err');
    if (navigator.vibrate) navigator.vibrate([150, 80, 150]);
    try { $('file').click(); } catch (e) {}   // có thể bị trình duyệt chặn, khi đó chạm nút vàng
  }

  function getTrack() {
    const v = document.querySelector('#reader video');
    return v && v.srcObject ? v.srcObject.getVideoTracks()[0] : null;
  }

  function setupCamera() {
    const t = getTrack();
    if (!t || !t.getCapabilities) return;
    const c = t.getCapabilities();
    let any = false;
    if (c.focusMode && c.focusMode.indexOf('continuous') >= 0) {
      t.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
    }
    if (c.zoom) {
      const z = $('zoom');
      z.min = c.zoom.min; z.max = c.zoom.max; z.step = c.zoom.step || 0.1; z.value = c.zoom.min;
      z.oninput = () => t.applyConstraints({ advanced: [{ zoom: Number(z.value) }] }).catch(() => {});
      any = true;
    }
    $('zoom').style.display = c.zoom ? 'block' : 'none';
    $('btnTorch').style.display = c.torch ? 'inline-block' : 'none';
    if (c.torch) any = true;
    $('tools').style.display = any ? 'flex' : 'none';
  }

  $('btnTorch').onclick = () => {
    const t = getTrack(); if (!t) return;
    torchOn = !torchOn;
    t.applyConstraints({ advanced: [{ torch: torchOn }] }).catch(() => {});
  };

  async function startScan() {
    if (API_URL.indexOf('http') !== 0) { status('Chưa dán URL Apps Script vào tệp.', 'err'); return; }
    if (scanning) return;
    $('photoBox').style.display = 'none';
    try {
      scanner = new Html5Qrcode('reader', {
        formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
        experimentalFeatures: { useBarCodeDetectorIfSupported: true }
      });
      await scanner.start(
        { facingMode: 'environment' },
        {
          fps: 12,
          videoConstraints: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
        },
        onScan, () => {}
      );
      scanning = true;
      $('btnScan').textContent = 'Dừng camera';
      $('btnScan').classList.add('stop');
      status('Đưa mã QR vào khung hình', 'wait');
      setTimeout(setupCamera, 500);
      armTimer();
    } catch (e) {
      status('✘ Không mở được camera. Hãy cho phép truy cập camera trong cài đặt trình duyệt.', 'err');
      $('photoBox').style.display = 'block';
    }
  }

  async function stopScan() {
    clearTimer();
    if (!scanning) return;
    scanning = false;
    try { await scanner.stop(); scanner.clear(); } catch (e) {}
    $('btnScan').textContent = 'Quét dữ liệu';
    $('btnScan').classList.remove('stop');
    $('tools').style.display = 'none';
    torchOn = false;
    status('');
  }

  // ---------- Chụp ảnh và đọc mã (chế độ dự phòng) ----------
  function resizeBlob(file, maxSide) {
    return createImageBitmap(file).then(bmp => new Promise(resolve => {
      const k = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * k);
      c.height = Math.round(bmp.height * k);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      c.toBlob(b => resolve(b), 'image/jpeg', 0.95);
    }));
  }

  async function nativeDecode(blob) {
    if (!('BarcodeDetector' in window)) return null;
    try {
      const det = new BarcodeDetector({ formats: ['qr_code'] });
      const bmp = await createImageBitmap(blob);
      const r = await det.detect(bmp);
      return r.length ? r[0].rawValue : null;
    } catch (e) { return null; }
  }

  async function decodeFile(file) {
    const s = new Html5Qrcode('readerFile', {
      formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
      experimentalFeatures: { useBarCodeDetectorIfSupported: true }
    });
    try {
      for (const size of [0, 2000, 1400, 1000, 700, 480]) {
        let blob = file;
        if (size) {
          try { blob = await resizeBlob(file, size); } catch (e) { continue; }
        }
        let text = await nativeDecode(blob);
        if (text) return text;
        try {
          text = await s.scanFile(new File([blob], 'q.jpg', { type: 'image/jpeg' }), false);
          if (text) return text;
        } catch (e) {}
      }
      return null;
    } finally {
      try { s.clear(); } catch (x) {}
    }
  }

  $('file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file || photoBusy) return;
    photoBusy = true;
    status('Đang đọc mã QR từ ảnh...', 'wait');
    const text = await decodeFile(file);
    photoBusy = false;
    if (!text) {
      status('✘ Không đọc được mã trong ảnh. Hãy chụp lại, gần hơn, rõ nét hơn và đủ sáng.', 'err');
      return;
    }
    if (handleText(text)) {
      $('photoBox').style.display = 'none';
      startScan();   // tự quay lại quét trực tiếp cho mã tiếp theo
    }
  });

  $('btnBackLive').onclick = () => startScan();
  $('btnScan').onclick = () => scanning ? stopScan() : startScan();
  $('btnSendOtp').onclick = sendOtp;
  $('btnVerify').onclick = verifyOtp;
  $('btnLogout').onclick = logout;
  $('otp').addEventListener('keydown', e => { if (e.key === 'Enter') verifyOtp(); });
  $('email').addEventListener('keydown', e => { if (e.key === 'Enter') sendOtp(); });

  // ---------- Khởi động ----------
  (async function init() {
    token = lsGet('qr_token'); userEmail = lsGet('qr_email');
    if (!token) { showLogin(); return; }
    try {
      const r = await api({ action: 'check', token: token }, 20000);
      if (r.ok) { userEmail = r.email; showApp(); }
      else showLogin('Phiên đăng nhập đã hết hạn. Hãy đăng nhập lại.', 'err');
    } catch (e) {
      showApp(); // mất mạng tạm thời: vẫn vào màn hình quét
    }
  })();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
